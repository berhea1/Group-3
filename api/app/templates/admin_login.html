<!doctype html>
<html>
  <head>
    <base href="{{ request.scope.get('root_path', '') }}/">
    <meta charset="utf-8">
    <title>Admin Login</title>
  </head>
  <body style="font-family: sans-serif; max-width: 720px; margin: 40px auto;">
    <h1>Admin Login</h1>

    <p style="opacity:.8;">
      This is a placeholder login page.
    </p>

    <form method="post" action="admin/login">
      <label>Username</label><br/>
      <input name="username" style="width:100%; padding:10px; font-size:18px;" /><br/><br/>

      <label>Password</label><br/>
      <input type="password" name="password" style="width:100%; padding:10px; font-size:18px;" /><br/><br/>

      <button type="submit" style="padding:10px 14px; font-size:16px;">
        Login
      </button>
    </form>

    <hr style="margin: 24px 0;">
    <a href="">Back</a>
  </body>
</html>
